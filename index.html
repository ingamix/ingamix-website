<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingamix — Time Out. Game On.</title>
  <meta name="description" content="Fan engagement for live sports venues. No app download." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #29abe2;
      --blue-dim: rgba(41, 171, 226, 0.15);
      --blue-glow: rgba(41, 171, 226, 0.35);
      --white: #ffffff;
      --off-white: rgba(255,255,255,0.7);
      --dim: rgba(255,255,255,0.35);
      --bg: #080c10;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(41,171,226,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(41,171,226,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(41,171,226,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(41,171,226,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 96px;
      text-align: center;
    }

    .logo-wrap {
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(-16px);
      animation: fadeUp 0.8s ease forwards 0.1s;
    }

    .logo-wrap img {
      width: min(380px, 80vw);
      height: auto;
      display: block;
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 300;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.1em;
      color: var(--off-white);
      text-transform: uppercase;
      line-height: 1.5;
      max-width: 480px;
      margin-bottom: 56px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.8s ease forwards 0.35s;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      margin: 0 auto 56px;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 0.55s;
    }

    .cta-block {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.8s ease forwards 0.65s;
    }

    .cta-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 16px;
    }

    .cta-link {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      letter-spacing: 0.06em;
      color: var(--white);
      text-decoration: none;
      padding: 14px 36px;
      border: 1px solid rgba(41,171,226,0.4);
      background: var(--blue-dim);
      transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-link:hover {
      background: rgba(41,171,226,0.22);
      border-color: var(--blue);
      box-shadow: 0 0 24px var(--blue-glow);
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: var(--dim);
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(8,12,16,0.8);
      backdrop-filter: blur(8px);
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1s;
    }

    footer a {
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--blue); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      .page { padding: 40px 20px 80px; }
    }
  </style>
</head>
<body>

<main class="page">

  <div class="logo-wrap">
    <img
      src="/assets/ingamix_full_color.png"
      alt="Ingamix — Time Out. Game On."
      width="380"
      height="190"
    />
  </div>

  <p class="tagline">
    Fan engagement for live sports venues.<br>No app download.
  </p>

  <div class="divider"></div>

  <div class="cta-block">
    <p class="cta-label">Get in touch</p>
    <a class="cta-link" href="mailto:ben@ingamix.com">ben@ingamix.com</a>
  </div>

</main>

<footer>
  <span>© 2026 Ingamix LLC</span>
  <span style="opacity:0.3">·</span>
  <a href="mailto:ben@ingamix.com">ben@ingamix.com</a>
</footer>

</body>
</html>
